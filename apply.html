<section class="page-section">
    <h1>Internship Application Form</h1>
    <p>Fill in your details to apply for an internship.</p>

    <form class="application-form">
        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Student ID</label>
        <input type="text" placeholder="Enter your student ID" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Select Internship</label>
        <select required>
            <option value="">Choose an internship</option>
            <option>Web Development Intern</option>
            <option>Cloud Computing Intern</option>
            <option>AI and ML Intern</option>
        </select>

        <label>Skills</label>
        <textarea rows="4" placeholder="Enter your skills"></textarea>

        <button type="submit" class="btn">Submit Application</button>
    </form>
</section>

<footer>
    <p>© 2026 InternTrack | Student Internship Portal</p>
</footer>

</html>
